[workspace]
resolver = "2"
members = ["host", "methods", "methods/guest"]

# Cost of verifying one Bedrock Proof of Leadership (Circom Groth16 over BN254) inside
# RISC Zero 3.1, the version an Ethereum-side LEZ-finality proof would use.
[workspace.dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }
risc0-build = "=3.0.7"
serde = { version = "1", features = ["derive"] }
substrate-bn = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
# RISC Zero's accelerated BN254 (zkVM precompile); same API on the host.
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
