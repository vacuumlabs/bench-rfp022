[workspace]
resolver = "2"
members = ["host", "methods", "methods/guest"]

# LEZ-side claim proof: RISC Zero 3.0.5 as LEZ v0.4.0-rc3 uses it. Cargo.lock starts from
# rfp-021/helios-check's lock, whose RISC Zero crates are pinned to LEZ rc3's lock.
[workspace.dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-build = "=3.0.5"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
