[package]
name = "release-script"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
sp1-bridge-lib = { path = "../lib" }
hex = "0.4"
serde_json = "1"
sp1-prover = "6.10.0"
sp1-hypercube = "6.10.0"
sp1-primitives = "6.10.0"
sp1-recursion-circuit = "6.10.0"
sp1-recursion-executor = "6.10.0"
sp1-recursion-gnark-ffi = "6.10.0"
slop-algebra = "6.10.0"
slop-bn254 = "6.10.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
bincode = "1.3"

[build-dependencies]
sp1-build = "6.0.1"
